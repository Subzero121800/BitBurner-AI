<svg width="100%" viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif">
  <title>BitBurner-AI architecture</title>
  <desc>Three columns: HOST runs editor, bitburner-filesync (push to game over WS :12525), and scb-watch (file watcher, Ollama probe, heartbeat, log sink on :9999). IN-GAME runs scb.js (orchestrator), ollama-player.js (AI loop) which imports ollama-actions.js, and scb-watchdog.js which hot-reloads scb.js and flushes /logs/* to the sink. EXTERNAL is the Ollama backend reachable at localhost or LAN. The architecture also surfaces approve-patch.js as the human-in-the-loop reviewer for AI-proposed changes to protected files.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L9 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style><![CDATA[
      .col-bg     { fill: #0a1626; stroke: #2a3a55; stroke-width: 1; rx: 12; ry: 12; }
      .col-label  { fill: #6a8eb3; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }

      .box        { fill: #0c447c; stroke: #85b7eb; stroke-width: 0.75; rx: 8; ry: 8; }
      .box-alt    { fill: #1e2f4a; stroke: #6f9bcd; stroke-width: 0.75; rx: 8; ry: 8; }
      .box-ai     { fill: #16365e; stroke: #99c5f0; stroke-width: 0.75; rx: 8; ry: 8; }
      .box-ollama { fill: #1d4429; stroke: #79c08e; stroke-width: 0.75; rx: 8; ry: 8; }
      .box-human  { fill: #4a2d1e; stroke: #d8a36a; stroke-width: 0.75; rx: 8; ry: 8; }

      .title      { fill: #b5d4f4; font-size: 15px; font-weight: 600; }
      .subtitle   { fill: #85b7eb; font-size: 11.5px; }
      .alt-title  { fill: #d4e3f5; font-size: 14px; font-weight: 600; }
      .ollama-t   { fill: #c8eed3; font-size: 15px; font-weight: 600; }
      .human-t    { fill: #f4d2a3; font-size: 14px; font-weight: 600; }

      .arrow      { fill: none; stroke: #9c9a92; stroke-width: 1.6; }
      .arrow-cool { fill: none; stroke: #79c08e; stroke-width: 1.6; }
      .arrow-warm { fill: none; stroke: #d8a36a; stroke-width: 1.6; }
      .arrow-dim  { fill: none; stroke: #5b6a82; stroke-width: 1.4; stroke-dasharray: 5,4; }

      .arrowlbl   { fill: #c2c0b6; font-size: 11px; }
      .arrowlbl-mono { fill: #c2c0b6; font-size: 10.5px; font-family: monospace; }
      .file       { fill: #b9b6a7; font-size: 10.5px; font-family: monospace; }
    ]]></style>
  </defs>

  <!-- ============ COLUMN BACKGROUNDS ============ -->
  <rect class="col-bg" x="20"  y="40"  width="280" height="500"/>
  <rect class="col-bg" x="320" y="40"  width="500" height="500"/>
  <rect class="col-bg" x="840" y="40"  width="180" height="500"/>

  <text class="col-label" x="40"  y="30">HOST · MAC</text>
  <text class="col-label" x="340" y="30">IN-GAME · BITBURNER</text>
  <text class="col-label" x="860" y="30">EXTERNAL</text>

  <!-- ============ HOST COLUMN ============ -->

  <!-- Editor -->
  <rect class="box" x="60" y="70"  width="200" height="60"/>
  <text class="title"    x="160" y="96"  text-anchor="middle">Your editor</text>
  <text class="subtitle" x="160" y="115" text-anchor="middle">VS Code · any IDE</text>

  <!-- bitburner-filesync -->
  <rect class="box" x="60" y="170" width="200" height="64"/>
  <text class="title"    x="160" y="196" text-anchor="middle">bitburner-filesync</text>
  <text class="subtitle" x="160" y="215" text-anchor="middle">push only · :12525 (WS)</text>
  <text class="subtitle" x="160" y="229" text-anchor="middle">.js · .script · .txt</text>

  <!-- scb-watch -->
  <rect class="box-alt" x="60" y="280" width="200" height="120"/>
  <text class="alt-title" x="160" y="306" text-anchor="middle">scb-watch.js</text>
  <text class="subtitle"  x="76"  y="328">file watcher · mtime tickle</text>
  <text class="subtitle"  x="76"  y="346">writes /Temp/scb-restart</text>
  <text class="subtitle"  x="76"  y="362">writes /Temp/scb-heartbeat</text>
  <text class="subtitle"  x="76"  y="378">writes /Temp/ollama-host</text>
  <text class="subtitle"  x="76"  y="394">log sink :9999 (loopback)</text>

  <!-- macOS notification -->
  <rect class="box-human" x="60" y="430" width="200" height="60"/>
  <text class="human-t"   x="160" y="456" text-anchor="middle">macOS notification</text>
  <text class="subtitle"  x="160" y="475" text-anchor="middle">if sync silent &gt; 60s</text>

  <!-- Editor → filesync -->
  <line class="arrow" x1="160" y1="130" x2="160" y2="166" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="167" y="153">save</text>

  <!-- filesync ↔ scb-watch (scb-watch knows filesync state via .run/sync.log) -->
  <line class="arrow-dim" x1="160" y1="234" x2="160" y2="276"/>
  <text class="arrowlbl" x="167" y="259">.run/sync.log</text>

  <!-- scb-watch → notification -->
  <line class="arrow-warm" x1="160" y1="400" x2="160" y2="426" marker-end="url(#arrow)"/>

  <!-- ============ IN-GAME COLUMN ============ -->

  <!-- scb.js -->
  <rect class="box" x="345" y="70"  width="220" height="100"/>
  <text class="title"    x="365" y="94">/scb.js</text>
  <text class="subtitle" x="365" y="114">orchestrator · cycle 30 s</text>
  <text class="subtitle" x="365" y="130">scan · root · backdoor · deploy</text>
  <text class="subtitle" x="365" y="146">writes /Temp/economy.json</text>
  <text class="subtitle" x="365" y="162">writes /logs/scb.txt</text>

  <!-- companions -->
  <rect class="box-alt" x="585" y="70" width="220" height="100"/>
  <text class="alt-title" x="605" y="94">companions</text>
  <text class="subtitle"  x="605" y="114">/gang-manager.js</text>
  <text class="subtitle"  x="605" y="130">/bladeburner-manager.js</text>
  <text class="subtitle"  x="605" y="146">+ user-supplied helpers</text>
  <text class="subtitle"  x="605" y="162">writes /logs/&lt;name&gt;.txt</text>

  <!-- /scb-watchdog.js -->
  <rect class="box" x="345" y="200" width="220" height="100"/>
  <text class="title"    x="365" y="224">/scb-watchdog.js</text>
  <text class="subtitle" x="365" y="244">poll /Temp/scb-restart.txt</text>
  <text class="subtitle" x="365" y="260">→ kill scb.js + re-exec</text>
  <text class="subtitle" x="365" y="276">DOM auto-Connect on RAPI drop</text>
  <text class="subtitle" x="365" y="292">flush /logs/* via cursor</text>

  <!-- /ollama-player.js -->
  <rect class="box-ai" x="585" y="200" width="220" height="160"/>
  <text class="title"    x="605" y="224">/ollama-player.js</text>
  <text class="subtitle" x="605" y="244">OBSERVE → DECIDE → EXECUTE</text>
  <text class="subtitle" x="605" y="260">reads /Temp/ollama-host.txt</text>
  <text class="subtitle" x="605" y="276">reads /logs/ollama-player.txt</text>
  <text class="subtitle" x="605" y="292">→ recentActions / jammedActions</text>
  <text class="subtitle" x="605" y="308">savings lock + repeat-suppress</text>
  <text class="subtitle" x="605" y="324">systemHealth.syncStale rule</text>
  <text class="subtitle" x="605" y="340">writes /logs/ollama-player.txt</text>

  <!-- /ollama-actions.js -->
  <rect class="box-ai" x="345" y="335" width="220" height="100"/>
  <text class="title"    x="365" y="359">/ollama-actions.js</text>
  <text class="subtitle" x="365" y="379">ACTION_SCHEMA · dispatcher</text>
  <text class="subtitle" x="365" y="395">guard-railed FS actions</text>
  <text class="subtitle" x="365" y="411">PROTECTED + path traversal</text>
  <text class="subtitle" x="365" y="427">propose_patch + reconnect_remote_api</text>

  <!-- in-game state files cluster -->
  <rect class="box-alt" x="345" y="465" width="460" height="60"/>
  <text class="alt-title" x="365" y="487">in-game state files</text>
  <text class="file"      x="365" y="504">/logs/* /Temp/economy.json /Temp/ai-state.json</text>
  <text class="file"      x="365" y="519">/ai/generated/  /ai/scratch/  /ai/patches/pending-patch.json</text>

  <!-- approve-patch -->
  <rect class="box-human" x="585" y="380" width="220" height="60"/>
  <text class="human-t"   x="605" y="404">/approve-patch.js</text>
  <text class="subtitle"  x="605" y="423">human review · --approve</text>

  <!-- ============ EXTERNAL COLUMN ============ -->

  <rect class="box-ollama" x="855" y="200" width="150" height="160"/>
  <text class="ollama-t"  x="930" y="226" text-anchor="middle">Ollama</text>
  <text class="subtitle"  x="930" y="246" text-anchor="middle">localhost</text>
  <text class="subtitle"  x="930" y="262" text-anchor="middle">or LAN host</text>
  <text class="subtitle"  x="930" y="280" text-anchor="middle">:11434</text>
  <text class="subtitle"  x="930" y="306" text-anchor="middle">candidates from</text>
  <text class="subtitle"  x="930" y="322" text-anchor="middle">watch/ollama-</text>
  <text class="subtitle"  x="930" y="338" text-anchor="middle">candidates.json</text>

  <!-- ============ ARROWS ============ -->

  <!-- filesync → game (WS :12525) -->
  <path class="arrow" d="M 260 202 C 290 202, 310 120, 345 120" marker-end="url(#arrow)" fill="none"/>
  <text class="arrowlbl" x="285" y="170" text-anchor="middle">WS :12525</text>

  <!-- scb.js → companions -->
  <line class="arrow" x1="565" y1="120" x2="585" y2="120" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="575" y="113" text-anchor="middle">spawn</text>

  <!-- scb.js → /scb-watchdog.js (ensure + spawn) -->
  <line class="arrow" x1="455" y1="170" x2="455" y2="196" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="462" y="187">spawn</text>

  <!-- scb-watchdog → scb.js (kill+restart) -->
  <path class="arrow-warm" d="M 360 200 C 340 200, 320 130, 345 130" marker-end="url(#arrow)" fill="none"/>
  <text class="arrowlbl" x="316" y="170" text-anchor="end">kill+run</text>

  <!-- scb-watchdog → host sink (POST log chunks) -->
  <path class="arrow-warm" d="M 345 250 C 290 250, 270 350, 260 360" marker-end="url(#arrow)" fill="none" stroke-dasharray="6,4"/>
  <text class="arrowlbl-mono" x="284" y="318" text-anchor="end">POST /sink/&lt;name&gt;</text>

  <!-- scb.js → ollama-player (spawn) -->
  <path class="arrow" d="M 565 145 C 580 145, 580 220, 585 220" marker-end="url(#arrow)" fill="none"/>
  <text class="arrowlbl" x="572" y="186" text-anchor="middle">spawn</text>

  <!-- ollama-player imports actions -->
  <line class="arrow" x1="585" y1="335" x2="565" y2="365" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="566" y="335" text-anchor="end">import</text>

  <!-- ollama-player ↔ Ollama (HTTP) -->
  <line class="arrow-cool" x1="805" y1="280" x2="855" y2="280" marker-end="url(#arrow)"/>
  <text class="arrowlbl-mono" x="830" y="273" text-anchor="middle">/api/generate</text>

  <!-- ollama-actions / ollama-player → state files -->
  <line class="arrow-dim" x1="455" y1="435" x2="455" y2="465"/>
  <line class="arrow-dim" x1="695" y1="360" x2="695" y2="465"/>

  <!-- propose_patch → /ai/patches → approve-patch -->
  <path class="arrow-warm" d="M 695 435 C 695 415, 695 405, 695 405" stroke-dasharray="5,4"/>
  <line class="arrow-warm" x1="695" y1="465" x2="695" y2="442" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="702" y="456">propose_patch</text>

  <!-- approve-patch → in-game state (apply) -->
  <line class="arrow-warm" x1="605" y1="440" x2="605" y2="465" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="612" y="455">apply</text>

  <!-- /Temp coordination files: filesync delivers them in (note for clarity) -->
  <text class="file" x="280" y="455" text-anchor="end">/Temp via filesync</text>

</svg>
