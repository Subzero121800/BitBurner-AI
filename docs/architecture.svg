<svg width="100%" viewBox="0 0 880 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif">
  <title>SCB BitBurner-AI architecture</title>
  <desc>Editor saves go through bitburner-filesync (WS :12525) to the game. scb-watch on the host watches files, probes Ollama endpoints, hosts a log sink on :9999, and writes /Temp/* coordination files. In the game scb.js orchestrates rooting and deployment, scb-watchdog hot-reloads scb.js when filesync delivers new code and flushes /logs/* to the host sink, ollama-player loops OBSERVE-DECIDE-EXECUTE against an Ollama backend (local or LAN), ollama-actions provides the dispatcher with guard-railed filesystem actions, and approve-patch.js gates AI-proposed changes to protected files.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box      { fill: #0c447c; stroke: #85b7eb; stroke-width: 0.75; }
      .alt      { fill: #1e2f4a; stroke: #6f9bcd; stroke-width: 0.75; }
      .ollama   { fill: #1d4429; stroke: #79c08e; stroke-width: 0.75; }
      .human    { fill: #4a2d1e; stroke: #d8a36a; stroke-width: 0.75; }
      .title    { fill: #b5d4f4; font-size: 14px; font-weight: 500; }
      .subtitle { fill: #85b7eb; font-size: 11px; }
      .alt-title{ fill: #d4e3f5; font-size: 14px; font-weight: 500; }
      .alt-sub  { fill: #a4bfd9; font-size: 11px; }
      .ollama-t { fill: #c8eed3; font-size: 14px; font-weight: 500; }
      .human-t  { fill: #f4d2a3; font-size: 14px; font-weight: 500; }
      .grouplbl { fill: #6a8eb3; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
      .arrow    { fill: none; stroke: #9c9a92; stroke-width: 1.5; }
      .arrow-warm { stroke: #d8a36a; }
      .arrow-cool { stroke: #79c08e; }
      .arrowlbl { fill: #c2c0b6; font-size: 11px; }
      .file     { fill: #c2c0b6; font-size: 11px; font-family: monospace; }
    </style>
  </defs>

  <!-- BAND LABELS -->
  <text class="grouplbl" x="20"  y="22">HOST (MAC)</text>
  <text class="grouplbl" x="20"  y="262">IN-GAME (BITBURNER)</text>
  <text class="grouplbl" x="20"  y="612">EXTERNAL</text>

  <line x1="20" y1="244" x2="860" y2="244" stroke="#3a4a64" stroke-dasharray="3,4"/>
  <line x1="20" y1="594" x2="860" y2="594" stroke="#3a4a64" stroke-dasharray="3,4"/>

  <!-- ═════════════ HOST BAND ═════════════ -->

  <rect class="box" x="40"  y="40" width="170" height="56" rx="8"/>
  <text class="title"    x="125" y="62"  text-anchor="middle">Your editor</text>
  <text class="subtitle" x="125" y="80"  text-anchor="middle">VS Code / any IDE</text>

  <rect class="box" x="280" y="40" width="180" height="56" rx="8"/>
  <text class="title"    x="370" y="62" text-anchor="middle">bitburner-filesync</text>
  <text class="subtitle" x="370" y="80" text-anchor="middle">push only · :12525 (WS)</text>

  <line class="arrow" x1="210" y1="68" x2="280" y2="68" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="245" y="60" text-anchor="middle">save</text>

  <rect class="alt" x="530" y="40" width="320" height="100" rx="8"/>
  <text class="alt-title" x="545" y="60">scb-watch.js</text>
  <text class="alt-sub"   x="545" y="78">file watcher · Ollama probe · log sink :9999</text>
  <text class="alt-sub"   x="545" y="96">writes /Temp/scb-restart, heartbeat, ollama-host</text>
  <text class="alt-sub"   x="545" y="114">tickles mtime so chokidar always picks up edits</text>
  <text class="alt-sub"   x="545" y="132">tail -f .run/watch.log .run/game-*.log</text>

  <text class="file" x="370" y="120" text-anchor="middle">/Temp/scb-restart.txt</text>
  <text class="file" x="370" y="138" text-anchor="middle">/Temp/scb-heartbeat.txt</text>
  <text class="file" x="370" y="156" text-anchor="middle">/Temp/ollama-host.txt</text>

  <line class="arrow" x1="530" y1="115" x2="465" y2="125" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="500" y="108" text-anchor="middle">writes</text>

  <line class="arrow" x1="370" y1="96" x2="370" y2="200" stroke-dasharray="6,4"/>
  <text class="arrowlbl" x="295" y="180" text-anchor="end">all watched files +</text>
  <text class="arrowlbl" x="295" y="195" text-anchor="end">/Temp coordination</text>

  <!-- ═════════════ IN-GAME BAND ═════════════ -->

  <rect class="box" x="280" y="200" width="180" height="44" rx="8"/>
  <text class="title"    x="370" y="218" text-anchor="middle">Bitburner game</text>
  <text class="subtitle" x="370" y="234" text-anchor="middle">Remote File API client</text>

  <rect class="box" x="40" y="280" width="220" height="100" rx="8"/>
  <text class="title"    x="60" y="300">/scb.js</text>
  <text class="subtitle" x="60" y="318">orchestrator (cycle 30 s)</text>
  <text class="subtitle" x="60" y="334">scan · root · backdoor · deploy</text>
  <text class="subtitle" x="60" y="350">writes /Temp/economy.json</text>
  <text class="subtitle" x="60" y="366">writes /logs/scb.txt</text>

  <rect class="box" x="40" y="410" width="220" height="100" rx="8"/>
  <text class="title"    x="60" y="430">/scb-watchdog.js</text>
  <text class="subtitle" x="60" y="448">poll /Temp/scb-restart.txt</text>
  <text class="subtitle" x="60" y="464">→ kill scb.js + re-exec</text>
  <text class="subtitle" x="60" y="480">poll heartbeat → toast on RAPI drop</text>
  <text class="subtitle" x="60" y="496">flush /logs/* → host sink (cursor)</text>

  <rect class="box" x="320" y="280" width="260" height="160" rx="8"/>
  <text class="title"    x="340" y="300">/ollama-player.js</text>
  <text class="subtitle" x="340" y="318">OBSERVE → DECIDE → EXECUTE</text>
  <text class="subtitle" x="340" y="334">reads /Temp/ollama-host.txt</text>
  <text class="subtitle" x="340" y="352">reads /logs/ollama-player.txt</text>
  <text class="subtitle" x="340" y="368">→ recentActions / jammedActions</text>
  <text class="subtitle" x="340" y="386">savings lock + repeat-suppress</text>
  <text class="subtitle" x="340" y="402">writes /logs/ollama-player.txt</text>
  <text class="subtitle" x="340" y="420">writes /Temp/ai-state.json</text>

  <rect class="box" x="620" y="280" width="220" height="160" rx="8"/>
  <text class="title"    x="640" y="300">/ollama-actions.js</text>
  <text class="subtitle" x="640" y="318">ACTION_SCHEMA + dispatcher</text>
  <text class="subtitle" x="640" y="334">guard-railed FS actions:</text>
  <text class="subtitle" x="640" y="350">  read_file, list_files</text>
  <text class="subtitle" x="640" y="366">  write_generated_script (allowlist)</text>
  <text class="subtitle" x="640" y="382">  run_script (allowlist)</text>
  <text class="subtitle" x="640" y="398">  copy_script, kill_script</text>
  <text class="subtitle" x="640" y="416">  propose_patch → /ai/patches/</text>

  <rect class="alt" x="320" y="470" width="260" height="100" rx="8"/>
  <text class="alt-title" x="340" y="490">in-game state files</text>
  <text class="file"      x="340" y="510">/logs/scb.txt · /logs/ollama-player.txt</text>
  <text class="file"      x="340" y="528">/Temp/economy.json (savings policy)</text>
  <text class="file"      x="340" y="546">/ai/generated/  /ai/scratch/</text>
  <text class="file"      x="340" y="564">/ai/patches/pending-patch.json</text>

  <rect class="human" x="620" y="470" width="220" height="100" rx="8"/>
  <text class="human-t"   x="640" y="490">/approve-patch.js</text>
  <text class="subtitle"  x="640" y="510">human-in-loop reviewer</text>
  <text class="subtitle"  x="640" y="528">--approve / --discard / --list</text>
  <text class="subtitle"  x="640" y="546">snapshots target → applied-&lt;ts&gt;.json</text>
  <text class="subtitle"  x="640" y="564">applies patch in-game</text>

  <!-- ═════════════ EXTERNAL BAND ═════════════ -->

  <rect class="ollama" x="320" y="620" width="260" height="80" rx="8"/>
  <text class="ollama-t" x="340" y="642">Ollama backend</text>
  <text class="subtitle" x="340" y="660">local 127.0.0.1:11434  · LAN host</text>
  <text class="subtitle" x="340" y="676">candidates in watch/ollama-candidates.json</text>
  <text class="subtitle" x="340" y="692">picked by scb-watch on probe</text>

  <!-- ═════════════ ARROWS / FLOWS ═════════════ -->

  <line class="arrow" x1="150" y1="410" x2="150" y2="380" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="158" y="398">kill + run</text>

  <line class="arrow" x1="260" y1="320" x2="320" y2="320" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="290" y="312" text-anchor="middle">spawn</text>

  <line class="arrow" x1="580" y1="360" x2="620" y2="360" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="600" y="354" text-anchor="middle">import</text>

  <line class="arrow arrow-cool" x1="450" y1="440" x2="450" y2="620" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="arrowlbl" x="460" y="535">POST /api/generate</text>

  <line class="arrow arrow-warm" x1="260" y1="450" x2="690" y2="138" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text class="arrowlbl" x="490" y="245">POST /sink/&lt;name&gt; (cursor-based, every 30 s)</text>

  <line class="arrow" x1="450" y1="440" x2="450" y2="470" marker-end="url(#arrow)"/>

  <line class="arrow" x1="730" y1="440" x2="500" y2="470" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text class="arrowlbl" x="610" y="455">propose_patch</text>

  <line class="arrow" x1="580" y1="540" x2="620" y2="520" marker-end="url(#arrow)"/>
  <text class="arrowlbl" x="600" y="513">read</text>

  <line class="arrow arrow-warm" x1="730" y1="470" x2="260" y2="350" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text class="arrowlbl" x="490" y="392">--approve → ns.write target</text>

  <line class="arrow" x1="260" y1="360" x2="320" y2="525" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

  <line class="arrow" x1="370" y1="200" x2="370" y2="245" stroke-dasharray="6,4"/>

</svg>
